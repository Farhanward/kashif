[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kashif"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Local Arabic code and binary security mapper."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
kashif = "kashif.cli:main"

[tool.setuptools]
packages = ["kashif"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
